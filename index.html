<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nostalgia Radio</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    
    /* Radio Main Structure */
    .radio-box {
      width: 580px;
      background: linear-gradient(135deg, #b88654, #8b5a2b);
      border: 8px solid #4a2c11;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    }

    /* Radio Screen */
    #player {
      width: 100%;
      height: 280px;
      background: #000;
      border: 4px inset #5c3a21;
      border-radius: 8px;
    }

    /* Control Panel */
    .controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 15px;
      background: #d8b08c;
      padding: 10px;
      border: 2px solid #9c6b3f;
      border-radius: 8px;
    }
    
    .btn {
      padding: 8px 16px;
      cursor: pointer;
      border: 2px solid #704214;
      background: #e6ccb2;
      font-weight: bold;
      border-radius: 4px;
      transition: 0.3s;
      font-size: 14px;
    }
    .btn:hover { background: #cdb49d; }
    
    .status-text { font-size: 14px; font-weight: bold; color: #4a2c11; text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="radio-box">
  <!-- YouTube Video Screen -->
  <div id="player"></div>

  <!-- Radio Controls -->
  <div class="controls">
    <button class="btn" onclick="stopVideo()">STOP</button>
    <div class="status-text">NOSTALGIA RADIO</div>
    <button class="btn" onclick="playVideo()">PLAY</button>
  </div>
</div>

<!-- YouTube IFrame API Script -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  var player;
  // Your Playlist ID
  var playlistId = 'PLtgWTUdMPxCNhfFOxCw_8_K9aCU4vRVHo';

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      height: '280',
      width: '100%',
      playerVars: {
        'listType': 'playlist',
        'list': playlistId,
        'autoplay': 1,
        'controls': 1,
        'modestbranding': 1
      }
    });
  }

  function stopVideo() {
    player.stopVideo();
  }

  function playVideo() {
    player.playVideo();
  }
</script>

</body>
</html>
