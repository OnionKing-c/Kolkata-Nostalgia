<!DOCTYPE html>
<html>
<head>
    <title>কলকাতা নস্টালজিয়া</title>
    <style>
  body {
    margin: 0;
    padding: 0;
    font-family: sans-serif;
  }
  .bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: url('file_00000000862481fa992ad9f83149bdf2.png');
    background-size: cover; /* ছবিটি পুরো এলাকা জুড়ে যাবে */
    background-position: center center; /* ছবিটি সব সময় মাঝখানে থাকবে */
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="player-box">
            <h1>কলকাতা নস্টালজিয়া</h1>
            <input type="text" id="url" placeholder="ইউটিউব লিঙ্ক পেস্ট করুন">
            <br>
            <button onclick="play()">Play</button>
            <br><br>
            <div id="player"></div>
        </div>
    </div>
    <script>
        function play() {
            let url = document.getElementById('url').value;
            let id = url.split('v=')[1].split('&')[0];
            document.getElementById('player').innerHTML = '<iframe width="400" height="225" src="https://www.youtube.com/embed/'+id+'?autoplay=1" allowfullscreen></iframe>';
        }
    </script>
</body>
</html>
