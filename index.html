<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>পুরোনো নগমে - Kolkata Nostalgia</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #111;
      overflow: hidden;
    }

    /* পুরো ব্যাকগ্রাউন্ড ইমেজ */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: url('file_00000000862481fa992ad9f83149bdf2.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .main-title {
      position: absolute;
      top: 6%;
      text-align: center;
      color: #7b1113;
      font-size: 5vw;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.4), 0 0 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 2px;
      line-height: 1.2;
    }

    .radio-box {
      width: 580px;
      background: linear-gradient(135deg, #b88654, #8b5a2b);
      border: 5px solid #4a2c11;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      color: #333;
      position: absolute;
      bottom: 8%;
    }

    .radio-top-section { display: flex; gap: 10px; margin-bottom: 10px; }

    .radio-screen {
      flex: 1.4;
      background: #000;
      border: 3px inset #5c3a21;
      border-radius: 6px;
      overflow: hidden;
      height: 160px;
    }

    #player { width: 100%; height: 100%; }

    .radio-tuner {
      flex: 1;
      background: #1c1815;
      border: 3px inset #5c3a21;
      border-radius: 6px;
      padding: 8px;
      color: #f0e6d2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      height: 160px;
      box-sizing: border-box;
    }
    .tuner-scale { font-size: 9px; color: #aaa; letter-spacing: 0.5px; }
    .tuner-needle {
      width: 2px;
      height: 25px;
      background: #ff4d4d;
      position: absolute;
      top: 22px;
      left: 60px;
      box-shadow: 0 0 8px #ff4d4d;
      transition: left 0.3s ease;
    }
    .tuner-info { display: flex; justify-content: space-between; font-size: 9px; color: #ffcc00; font-weight: bold; }

    .radio-bottom-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #d8b08c;
      border: 2px solid #9c6b3f;
      border-radius: 6px;
      padding: 8px;
    }

    .control-row { display: flex; justify-content: space-between; gap: 5px; }
    .btn {
      background: #e6ccb2;
      border: 1px solid #704214;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      color: #111;
      flex: 1;
    }
    .btn:active { background: #cdb49d; transform: scale(0.95); }

    .radio-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding: 0 2px; }
    .radio-brand { font-size: 11px; font-weight: bold; color: #fff; letter-spacing: 1px; }
    .radio-sub-brand { font-size: 9px; color: #f0e6d2; }
    .footer-tagline { position: absolute; bottom: 2%; font-size: 13px; color: #d8b08c; font-style: italic; }
  </style>
</head>
<body>

  <div class="bg-container">
    <div class="main-title">পুরোনো<br>নগমে</div>
    <div class="radio-box">
      <div class="radio-top-section">
        <div class="radio-screen"><div id="player"></div></div>
        <div class="radio-tuner">
          <div class="tuner-scale">FM &nbsp; 88 &nbsp; 92 &nbsp; 96 &nbsp; 100 &nbsp; 104 &nbsp; 108</div>
          <div class="tuner-needle" id="tunerNeedle"></div>
          <div class="tuner-info">
            <span id="currentTime">00:00</span>
            <span>STEREO FM</span>
            <span id="totalTime">00:00</span>
          </div>
        </div>
      </div>

      <div class="radio-bottom-section">
        <div class="control-row">
          <button class="btn" onclick="prevTrack()">⏮ PREV</button>
          <button class="btn" onclick="seek(-10)">⏪ -10s</button>
          <button class="btn" onclick="seek(10)">+10s ⏩</button>
          <button class="btn" onclick="nextTrack()">NEXT ⏭</button>
        </div>
        <div class="control-row">
          <button class="btn" onclick="playVideo()">▶ PLAY</button>
          <button class="btn" onclick="pauseVideo()">⏸ PAUSE</button>
          <button class="btn" onclick="changeVolume(15)">VOL +</button>
          <button class="btn" onclick="changeVolume(-15)">VOL -</button>
        </div>
      </div>

      <div class="radio-footer">
        <div class="radio-brand">সুর তাল</div>
        <div class="radio-sub-brand">ক্ল্যাসিক নস্টালজিয়া রেডিও</div>
      </div>
    </div>
    <div class="footer-tagline">সুর কখনও পুরোনো হয় না...</div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    var player;
    // তোমার দেওয়া সেই ২৪টি গানের আইডি
    var playlist = [
        "YwCLDAC1aEw", "KCP-PWecrRw", "m_yhTr_IDqU", "YfiWu5lRI1s",
        "yn9Pnp1m650", "NLaLAiY9Tcg", "5wOmqB5PAko", "YnvW9WTEdfw", "oPbE5UHDqJo",
        "HE_iYvv5mL8", "EskJP3wqoUQ", "Sw7wdaJektI", "2-244sTF7Iw", "s4WEbB4vvVU",
        "k6QrKo25q84", "MmjOh8zTWik", "EMGnzU2F9fk", "k0w_Bapu8ac", "rqUPmN-rGhw",
        "_aApO1jN8YA", "e90alqXR9dM", "nJE24xodBbU", "RU1wbd2wA8I"
    ];
    var currentIndex = 0;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: playlist[currentIndex],
        playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
        events: { 'onReady': onPlayerReady, 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerReady(event) {
      event.target.playVideo();
      setInterval(updateRadioMeter, 1000);
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.ENDED) nextTrack();
    }

    function playVideo() { if(player) player.playVideo(); }
    function pauseVideo() { if(player) player.pauseVideo(); }
    function changeVolume(amount) { if(player) player.setVolume(player.getVolume() + amount); }
    function seek(sec) { if(player) player.seekTo(player.getCurrentTime() + sec); }

    function nextTrack() {
      currentIndex = (currentIndex + 1) % playlist.length;
      player.loadVideoById(playlist[currentIndex]);
    }

    function prevTrack() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      player.loadVideoById(playlist[currentIndex]);
    }

    function updateRadioMeter() {
      if (player && player.getCurrentTime) {
        var cur = player.getCurrentTime();
        var dur = player.getDuration();
        document.getElementById('currentTime').innerText = formatTime(cur);
        document.getElementById('totalTime').innerText = formatTime(dur);
        var pos = 20 + (cur / dur) * 160;
        document.getElementById('tunerNeedle').style.left = pos + 'px';
      }
    }

    function formatTime(s) {
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return (m < 10 ? '0' : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
    }
  </script>
</body>
</html>
